name: Playwright Tests

on:
  # ── Trigger manual ────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      browser:
        description: 'Navegador'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - mobile-chrome
      environment:
        description: 'Entorno'
        required: false
        default: 'production'
        type: choice
        options:
          - production

  # ── Trigger automático en PR cuando cambian tests o src ───────────────────
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Cache node_modules ──────────────────────────────────────────────
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      # ── 4. Cache navegadores Playwright ───────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps

      # ── 5. Calcular flag de proyecto (browser) ────────────────────────────
      - name: Set project flag
        id: cfg
        run: |
          B="${{ inputs.browser }}"
          if [ -n "$B" ] && [ "$B" != "all" ]; then
            echo "flag=--project=$B" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
          fi
          echo "browser=${B:-all}" >> $GITHUB_OUTPUT
          echo "environment=${{ inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      # ── 6. Ejecutar suites (continue-on-error para recoger todos los resultados) ──
      - name: 'Tests :: auth'
        id: auth
        run: npx playwright test tests/auth.spec.ts ${{ steps.cfg.outputs.flag }}
        continue-on-error: true
        env:
          CI: 'true'

      - name: 'Tests :: inventory'
        id: inventory
        run: npx playwright test tests/inventory.spec.ts ${{ steps.cfg.outputs.flag }}
        continue-on-error: true
        env:
          CI: 'true'

      - name: 'Tests :: checkout'
        id: checkout
        run: npx playwright test tests/checkout.spec.ts ${{ steps.cfg.outputs.flag }}
        continue-on-error: true
        env:
          CI: 'true'

      # ── 7. Generar reporte Allure (siempre, incluso si los tests fallan) ───
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      # ── 8. Subir artefactos ────────────────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ── 9. Resumen del workflow (visible en PR y en la ejecución) ──────────
      - name: Write job summary
        if: always()
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          AUTH_ICON=$(icon "${{ steps.auth.outcome }}")
          INV_ICON=$(icon  "${{ steps.inventory.outcome }}")
          CHK_ICON=$(icon  "${{ steps.checkout.outcome }}")

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🎭 Playwright Test Results

          | Suite          | Estado |
          |:---------------|:------:|
          | Authentication | ${AUTH_ICON} \`${{ steps.auth.outcome }}\`      |
          | Inventory      | ${INV_ICON} \`${{ steps.inventory.outcome }}\` |
          | Checkout       | ${CHK_ICON} \`${{ steps.checkout.outcome }}\`  |

          **Navegador:** \`${{ steps.cfg.outputs.browser }}\`
          **Entorno:** \`${{ steps.cfg.outputs.environment }}\`

          > 📦 Descarga el reporte Allure desde la sección **Artifacts** de este workflow.
          EOF

      # ── 10. Fallo global si alguna suite falló ────────────────────────────
      - name: Check overall result
        if: always()
        run: |
          if [ "${{ steps.auth.outcome }}"      != "success" ] || \
             [ "${{ steps.inventory.outcome }}" != "success" ] || \
             [ "${{ steps.checkout.outcome }}"  != "success" ]; then
            echo "::error::Una o más suites de tests han fallado."
            exit 1
          fi
