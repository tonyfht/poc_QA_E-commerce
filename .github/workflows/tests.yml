name: Playwright Tests

on:
  # ── Trigger manual ────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      browser:
        description: 'Navegador'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - mobile-chrome
      environment:
        description: 'Entorno'
        required: false
        default: 'production'
        type: choice
        options:
          - production

  # ── Trigger automático en PR cuando cambian tests o src ───────────────────
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest

    # ── PERMISOS necesarios para publicar en GitHub Pages ───────────────────
    permissions:
      contents: write   # leer/escribir la branch gh-pages
      pages: write      # desplegar en GitHub Pages
      id-token: write   # autenticación OIDC con Pages

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Cache node_modules ──────────────────────────────────────────────
      - name: Cache node_modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      # ── 4. Cache navegadores Playwright ───────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browsers + system deps
        run: npx playwright install --with-deps

      # ── 5. Calcular flag de proyecto (browser) ────────────────────────────
      - name: Set project flag
        id: cfg
        run: |
          B="${{ inputs.browser }}"
          if [ -n "$B" ] && [ "$B" != "all" ]; then
            echo "flag=--project=$B" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
          fi
          echo "browser=${B:-all}" >> $GITHUB_OUTPUT
          echo "environment=${{ inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      # ── 6. Ejecutar suites (continue-on-error para recoger todos los resultados) ──
      - name: 'Tests :: auth'
        id: auth
        run: npx playwright test tests/auth.spec.ts ${{ steps.cfg.outputs.flag }}
        continue-on-error: true
        env:
          CI: 'true'

      - name: 'Tests :: inventory'
        id: inventory
        run: npx playwright test tests/inventory.spec.ts ${{ steps.cfg.outputs.flag }}
        continue-on-error: true
        env:
          CI: 'true'

      - name: 'Tests :: checkout'
        id: checkout
        run: npx playwright test tests/checkout.spec.ts ${{ steps.cfg.outputs.flag }}
        continue-on-error: true
        env:
          CI: 'true'

      # ── 7. Recuperar histórico de Allure desde gh-pages ───────────────────
      #
      #  Flujo del histórico acumulativo:
      #    ejecución N-1 → allure-report/history/ guardada en gh-pages
      #    ejecución N   → copiamos ese history/ a allure-results/history/
      #                    → allure generate lo incluye en el nuevo reporte
      #                    → peaceiris sube el nuevo allure-report/ a gh-pages
      #    ejecución N+1 → repite el ciclo
      #
      - name: Restore Allure history from gh-pages
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true

          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            echo "Branch gh-pages encontrada — buscando carpeta history/"

            if git ls-tree origin/gh-pages history/ | grep -q .; then
              mkdir -p allure-results
              git archive origin/gh-pages -- history/ \
                | tar -x -C allure-results/
              echo "✅ Histórico de Allure restaurado desde gh-pages"
            else
              echo "ℹ️  No hay carpeta history/ en gh-pages todavía"
            fi
          else
            echo "ℹ️  Branch gh-pages no existe aún — primera ejecución"
          fi

      # ── 8. Generar reporte Allure (siempre, incluso si los tests fallan) ───
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      # ── 9. Subir artefactos ────────────────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ── 10. Publicar reporte Allure en GitHub Pages ────────────────────────
      #
      #  peaceiris/actions-gh-pages realiza un force-push de allure-report/
      #  a la branch gh-pages. El histórico NO se pierde porque ya está
      #  embebido dentro de allure-report/history/ (generado en el paso 8).
      #  La próxima ejecución lo recuperará en el paso 7.
      #
      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          commit_message: "ci: deploy Allure report [${{ github.run_number }}] (${{ github.sha }})"

      # ── 11. Resumen del workflow (visible en PR y en la ejecución) ─────────
      - name: Write job summary
        if: always()
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          AUTH_ICON=$(icon "${{ steps.auth.outcome }}")
          INV_ICON=$(icon  "${{ steps.inventory.outcome }}")
          CHK_ICON=$(icon  "${{ steps.checkout.outcome }}")

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🎭 Playwright Test Results

          | Suite          | Estado |
          |:---------------|:------:|
          | Authentication | ${AUTH_ICON} \`${{ steps.auth.outcome }}\`      |
          | Inventory      | ${INV_ICON} \`${{ steps.inventory.outcome }}\` |
          | Checkout       | ${CHK_ICON} \`${{ steps.checkout.outcome }}\`  |

          **Navegador:** \`${{ steps.cfg.outputs.browser }}\`
          **Entorno:** \`${{ steps.cfg.outputs.environment }}\`

          > 📊 [Ver reporte Allure en GitHub Pages](https://tonyfht.github.io/poc_playwright/)
          > 📦 Descarga el reporte desde la sección **Artifacts** de este workflow.
          EOF

      # ── 12. Fallo global si alguna suite falló ────────────────────────────
      - name: Check overall result
        if: always()
        run: |
          if [ "${{ steps.auth.outcome }}"      != "success" ] || \
             [ "${{ steps.inventory.outcome }}" != "success" ] || \
             [ "${{ steps.checkout.outcome }}"  != "success" ]; then
            echo "::error::Una o más suites de tests han fallado."
            exit 1
          fi
